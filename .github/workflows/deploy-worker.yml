name: Deploy Notify — Worker

# Same reasoning as deploy-api.yml — the actual deploy is Railway's (or your
# chosen PaaS's) own GitHub integration; this workflow only records the
# release in Sentry and uploads sourcemaps for the aura-worker project.

on:
  push:
    branches: [main]
    paths:
      - "apps/worker/**"
      - "packages/**"
      - "pnpm-lock.yaml"

env:
  DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"

jobs:
  sentry-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter aura-worker... run build

      - name: Create Sentry release and upload sourcemaps
        uses: getsentry/action-release@v3
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: aura
          SENTRY_PROJECT: aura-worker
        with:
          environment: production
          release: ${{ github.sha }}
          sourcemaps: apps/worker/dist
