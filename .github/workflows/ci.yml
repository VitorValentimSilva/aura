name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Dummy on purpose: `prisma generate` only needs this env var to resolve
  # (see packages/database/prisma.config.ts), it never connects to it.
  DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: E2E tests (api)
        run: pnpm --filter aura-api run test:e2e

      - name: E2E tests (worker)
        run: pnpm --filter aura-worker run test:e2e
