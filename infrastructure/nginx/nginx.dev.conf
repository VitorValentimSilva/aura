# Optional, local-only. Production does NOT use nginx — the chosen PaaS
# (Railway/Render/Fly.io) terminates TLS and reverse-proxies for you.
#
# Use this only if you want to test web (apps/web) and the api (apps/api)
# behind a single local origin, the way they might sit behind a real
# reverse proxy in some other deployment. See README.md in this folder for
# how to run it.

events {}

http {
  server {
    listen 8080;

    location /api/ {
      proxy_pass http://host.docker.internal:3001/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
      proxy_pass http://host.docker.internal:3000/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
